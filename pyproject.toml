[project]
name = "AliceUID"
version = "1.0.17"
description = "GsCore NIKKE 插件：邮箱登录、个人与角色面板、皮肤图鉴、联盟出刀和公开资料库"
requires-python = ">=3.10"
dependencies = [
    "XlsxWriter>=3.2.9,<4",
    "httpx>=0.27",
    "cryptography>=42",
    "playwright>=1.45",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "qrcode[pil]>=7.4",
    "jinja2>=3.1",
    "Pillow>=10",
    "opencc-python-reimplemented>=0.1.7",
]

[tool.ruff]
line-length = 100
