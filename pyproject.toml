[project]
name = "AliceUID"
version = "1.4.0"
description = "GsCore NIKKE 插件：账号绑定、个人名片与角色练度、图鉴与导出、联盟会战、活动日历、通用攻略查询与个人突袭推荐"
requires-python = ">=3.10"
dependencies = [
    "lxml>=6.1,<7",
    "XlsxWriter>=3.2.9,<4",
    "httpx>=0.27",
    "cryptography>=42",
    "playwright>=1.45",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "qrcode[pil]>=7.4",
    "jinja2>=3.1",
    "Pillow>=10",
    "opencc-python-reimplemented>=0.1.7",
]

[tool.ruff]
line-length = 100
